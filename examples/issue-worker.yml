# Copy this file to .github/workflows/issue-worker.yml in the PRIVATE target repository.
#
# Register a repository-level or Organization-level self-hosted runner that is
# visible to this repository and give it the custom label `codex`.

name: Issue Worker

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-worker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  implement:
    # Label application is the explicit authorization signal. issue-worker also
    # verifies that github.actor has write-level repository access.
    if: github.event.label.name == 'codex:run'

    # Choose the runner in the CALLER repository. This works with either a
    # repository-level runner or an Organization-level runner exposed to the repo.
    runs-on: [self-hosted, codex]
    timeout-minutes: 60

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Implement Issue with local Codex
        uses: qmore/issue-worker@main
        with:
          github-token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}

          # Optional project-specific preparation outside the Codex sandbox.
          # Keep credentials out of literal workflow command text.
          # setup-command: |
          #   composer install --prefer-dist --no-interaction --no-progress
          #   npm ci

          # Optional verification after Codex and before commit/push/PR.
          # verify-command: |
          #   php artisan test
          #   npm run build

          # Other optional inputs:
          # base-branch: develop
          # codex-model: gpt-5.6-sol
          # codex-effort: high
          # allow-network: 'false'

  # This job deliberately runs on a GitHub-hosted runner. If the self-hosted
  # machine disappears after `codex:working` was applied, it can still recover
  # the Issue state once GitHub concludes the implementation job.
  cleanup-state:
    needs: implement
    if: always() && github.event.label.name == 'codex:run'
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Recover stale issue-worker state
        uses: qmore/issue-worker/cleanup@main
        with:
          github-token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}
          job-result: ${{ needs.implement.result }}

# Production recommendation:
# Replace @main in BOTH uses statements with the same release tag (for example @v1)
# or, for maximum supply-chain stability, the same full commit SHA.
