version: 1

worker:
  id: mac-mini
  poll_interval: 30s
  concurrency: 1

github:
  api_url: https://api.github.com

# Explicit allowlist. The MVP does not enumerate whole Organizations.
repositories:
  - your-name/private-repository

labels:
  ready: codex:ready
  running: codex:running
  review: codex:review
  failed: codex:failed
  no_change: codex:no-change

# Empty uses ~/Library/Application Support/issue-worker/data on macOS.
workspace:
  root: ""

codex:
  # app-server creates a durable task visible in Codex clients.
  # exec keeps the existing terminal-only, ephemeral behavior.
  backend: exec
  # Optional socket for an existing shared app-server daemon. Empty starts a
  # stdio app-server that writes to the normal Codex task history.
  app_server_socket: ""
  timeout: 30m
  model: ""
  effort: ""
  allow_network: false
