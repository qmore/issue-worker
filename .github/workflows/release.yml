name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist

          build_target() {
            goos="$1"
            goarch="$2"
            label="$3"
            stage="$(mktemp -d)"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build \
                -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$stage/issue-worker" \
                ./cmd/issue-worker

            cp LICENSE "$stage/LICENSE"
            tar -C "$stage" -czf "dist/issue-worker_${label}.tar.gz" issue-worker LICENSE
            rm -rf "$stage"
          }

          build_target darwin arm64 Darwin_arm64
          build_target darwin amd64 Darwin_x86_64
          build_target linux arm64 Linux_arm64
          build_target linux amd64 Linux_x86_64

          (
            cd dist
            sha256sum issue-worker_*.tar.gz > SHA256SUMS
          )

      - name: Verify release binaries
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p verify
          tar -C verify -xzf dist/issue-worker_Linux_x86_64.tar.gz
          test "$(verify/issue-worker version)" = "$VERSION"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/issue-worker_*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
