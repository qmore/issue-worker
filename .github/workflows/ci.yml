name: CI

on:
  push:
  pull_request:

jobs:
  shell-syntax:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Validate Bash syntax
        run: bash -n scripts/*.sh tests/*.sh
      - name: Run helper tests
        run: bash tests/test-helpers.sh
      - name: Check whitespace errors in latest change
        run: git diff-tree --check --root -r HEAD

  action-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse Action and example YAML
        run: |
          ruby -e 'require "yaml"; %w[action.yml cleanup/action.yml examples/issue-worker.yml].each { |f| YAML.load_file(f); puts "#{f} OK" }'

  daemon-go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Download modules
        run: go mod download
      - name: Format workspace copy
        run: gofmt -w cmd internal
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee daemon-test.log
      - name: Upload daemon diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-test-${{ matrix.os }}
          path: daemon-test.log
      - name: Vet
        run: go vet ./...
      - name: Build daemon
        run: go build ./cmd/issue-worker
